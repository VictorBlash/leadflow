name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches the Dockerfile base image
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # The suite must pass with no secrets. Fail loudly if any ever leak into this job.
      # One test per line: bash -e ignores a failure that is not last in an && list.
      - name: Test
        run: |
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${SLACK_WEBHOOK_URL:-}"
          test -z "${LEADFLOW_API_KEY:-}"
          python -m pytest -q
